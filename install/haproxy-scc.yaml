apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: haproxy-scc
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
readOnlyRootFilesystem: false
allowedCapabilities:
  - NET_BIND_SERVICE
requiredDropCapabilities:
  - ALL
seccompProfiles:
  - runtime/default
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - projected
  - secret
users:
  - system:serviceaccount:haproxy-system:haproxy-haproxy-unified-gateway
# The chart's jobs (crdjob, gwapijob, ...) run under their own service accounts,
# so grant the SCC to every service account in the dedicated haproxy-system namespace.
groups:
  - system:serviceaccounts:haproxy-system
